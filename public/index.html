<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WoW Colombia RankingIO</title>
  <!-- Aquí conectamos el archivo CSS -->
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <!-- Encabezado de la página -->
  <nav class="navbar">
    <div class="brand">
      ⚔️ WOW <span>COLOMBIA</span> RAIDER.IO
    </div>
  </nav>

  <!-- Caja principal de subida de archivo -->
  <div class="main-container">
    <div class="raider-card">
      <h1>Análisis de Combate</h1>
      <p>Subir WoWCombatLog.txt (Cataclismo 4.3.4)</p>

      <div class="file-zone">
        <input type="file" id="logInput">
      </div>

      <button class="btn-gold" onclick="analizarLog()">Analizar Log de Combate</button>
    </div>
  </div>

  <script>
    async function analizarLog() {
      const fileInput = document.getElementById('logInput');
      if (!fileInput.files[0]) {
        alert("Por favor selecciona un archivo WoWCombatLog.txt primero");
        return;
      }

      const formData = new FormData();
      formData.append('log', fileInput.files[0]);

      try {
        const respuesta = await fetch('/api/parse-log', {
          method: 'POST',
          body: formData
        });
        const datos = await respuesta.json();
        
        // Guardar en la memoria del navegador
        localStorage.setItem('resultadoWoW', JSON.stringify(datos));
        alert("¡Log analizado y guardado con éxito!");
      } catch (error) {
        console.error("Error al analizar:", error);
        alert("Ocurrió un error al procesar el archivo.");
      }
    }
  </script>
</body>
</html>
