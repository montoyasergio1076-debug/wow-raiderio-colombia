      <div class="search-filter-section">

      // BRUJOS

    const guildsData = [
      { rank: 1, nombre: "Liquid Colombia", avance: "8/8 HC", dpsTotal: "450,200", miembros: 25 },
      { rank: 2, nombre: "Method Latam", avance: "8/8 HC", dpsTotal: "432,100", miembros: 25 },
      { rank: 3, nombre: "Echo Rag", avance: "7/8 HC", dpsTotal: "398,000", miembros: 25 },
      { rank: 4, nombre: "Ares Guild", avance: "6/8 HC", dpsTotal: "360,500", miembros: 10 }
    ];

    let claseSeleccionada = 'Guerrero';
    let ramaSeleccionada = 'Todas';
    let vistaActual = 'jugadores';

    function renderBarraClases() {
      const container = document.getElementById('classBarContainer');
      container.innerHTML = '';

      Object.keys(LOGOS_CLASES).forEach(clase => {
        const activeClass = (clase === claseSeleccionada) ? 'active' : '';
        container.innerHTML += `
          <button class="class-btn ${activeClass}" onclick="seleccionarClase('${clase}')">
            <img src="${LOGOS_CLASES[clase]}" alt="${clase}">
            ${clase}
          </button>
        `;
      });
    }

    function seleccionarClase(clase) {
      claseSeleccionada = clase;
      ramaSeleccionada = 'Todas';
      renderBarraClases();
      actualizarPestañasRamas();
      renderRanking();
    }

    function actualizarPestañasRamas() {
      const container = document.getElementById('specTabsContainer');
      container.innerHTML = '<button class="tab-btn active" onclick="cambiarRama(\'Todas\')">Todas</button>';

      if (ESPECILIZACIONES[claseSeleccionada]) {
        ESPECILIZACIONES[claseSeleccionada].forEach(rama => {
          const imgUrl = LOGOS_RAMAS[rama] || '';
          const imgTag = imgUrl ? `<img src="${imgUrl}" alt="${rama}">` : '';
          
          container.innerHTML += `
            <button class="tab-btn" onclick="cambiarRama('${rama}')">
              ${imgTag}
              ${rama}
            </button>
          `;
        });
      }
    }

    function cambiarRama(rama) {
      ramaSeleccionada = rama;
      document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
      if (event && event.target) event.target.classList.add('active');
      renderRanking();
    }

    function cambiarVista(tipo) {
      vistaActual = tipo;
      document.querySelectorAll('.view-tab-btn').forEach(b => b.classList.remove('active'));
      if (event && event.target) event.target.classList.add('active');

      const containerJugadores = document.getElementById('classBarContainer');
      const filtersSection = document.querySelector('.search-filter-section');

      if (tipo === 'guilds') {
        if (containerJugadores) containerJugadores.style.display = 'none';
        if (filtersSection) filtersSection.style.display = 'none';
        renderGuilds();
      } else {
        if (containerJugadores) containerJugadores.style.display = 'flex';
        if (filtersSection) filtersSection.style.display = 'flex';
        renderRanking();
      }
    }

    function filtrarTabla() {
      renderRanking();
    }

    function renderRanking() {
      const tbody = document.getElementById('rankingBody');
      const theadRow = document.getElementById('tableHeaderRow');
      const busqueda = document.getElementById('searchInput').value.toLowerCase();

      theadRow.innerHTML = `
        <th>#</th>
        <th>Personaje</th>
        <th>Clase</th>
        <th>Especialización</th>
        <th>DPS / HPS</th>
      `;

      tbody.innerHTML = '';

      const filtrados = rankingData.filter(j => {
        const coincideClase = (j.clase === claseSeleccionada);
        const coincideRama = (ramaSeleccionada === 'Todas' || j.rama === ramaSeleccionada);
        const coincideNombre = j.nombre.toLowerCase().includes(busqueda);
        return coincideClase && coincideRama && coincideNombre;
      });

      if (filtrados.length === 0) {
        tbody.innerHTML = '<tr><td colspan="5" style="text-align:center; color:#9d9d9d;">No se encontraron personajes para este filtro</td></tr>';
        return;
      }

      filtrados.forEach((j, index) => {
        const numeroRank = index + 1;
        let rankClass = 'rank-number';
        if (numeroRank === 1) rankClass = 'rank-top-1';
        if (numeroRank === 2) rankClass = 'rank-top-2';
        if (numeroRank === 3) rankClass = 'rank-top-3';

        const logoClase = LOGOS_CLASES[j.clase] || '';
        const colorClase = CLASES_CSS[j.clase] || '';

        tbody.innerHTML += `
          <tr>
            <td class="${rankClass}">#${numeroRank}</td>
            <td style="font-weight:bold; color:#fff;">${j.nombre}</td>
            <td class="${colorClase}">
              <img src="${logoClase}" class="class-icon-table" alt="">
              ${j.clase}
            </td>
            <td>${j.rama}</td>
            <td style="color:#f5ab00; font-weight:bold;">${j.dps}</td>
          </tr>
        `;
      });
    }

    function renderGuilds() {
      const tbody = document.getElementById('rankingBody');
      const theadRow = document.getElementById('tableHeaderRow');
      
      theadRow.innerHTML = `
        <th>#</th>
        <th>Hermandad (Guild)</th>
        <th>Progreso Banda</th>
        <th>DPS Conjunto</th>
        <th>Roster</th>
      `;

      tbody.innerHTML = '';
      guildsData.forEach(g => {
        tbody.innerHTML += `
          <tr>
            <td class="rank-top-1">#${g.rank}</td>
            <td style="font-weight:bold; color:#fff;">🛡️ ${g.nombre}</td>
            <td><span class="guild-progress">${g.avance}</span></td>
            <td style="color:#f5ab00; font-weight:bold;">${g.dpsTotal}</td>
            <td>${g.miembros} Jugadores</td>
          </tr>
        `;
      });
    }

    async function analizarLog() {
      const fileInput = document.getElementById('logInput');
      if (!fileInput.files[0]) {
        alert("Por favor selecciona un archivo WoWCombatLog.txt primero");
        return;
      }

      const formData = new FormData();
      formData.append('combatlog', fileInput.files[0]);

      try {
        const respuesta = await fetch('/upload-log', {
          method: 'POST',
          body: formData
        });
        
        const datos = await respuesta.json();

        if (datos && datos.success && datos.ranking && datos.ranking.length > 0) {
          localStorage.setItem('resultadoWoW', JSON.stringify(datos.ranking));

          datos.ranking.forEach(p => {
            rankingData.unshift({
              nombre: p.nombre,
              clase: p.clase || 'Guerrero',
              rama: p.rama || 'Furia',
              dps: (p.totalDaño / 60).toLocaleString('en-US', { maximumFractionDigits: 0 })
            });
          });

          renderRanking();
          alert("¡Log analizado correctamente y registrado en el Ranking!");
        } else {
          alert("El log se procesó pero no se encontraron eventos de combate válidos.");
        }

      } catch (error) {
        console.error("Error al analizar:", error);
        alert("Ocurrió un error al procesar el archivo en el servidor.");
      }
    }

    document.addEventListener('DOMContentLoaded', () => {
      renderBarraClases();
      actualizarPestañasRamas();
      renderRanking();
    });
  </script>
