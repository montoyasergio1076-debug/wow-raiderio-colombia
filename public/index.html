<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WoW Colombia RaiderIO - Rankings Globales</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <!-- Encabezado -->
  <nav class="navbar">
    <div class="brand">
      ⚔️ WOW <span>COLOMBIA</span> RAIDER.IO
    </div>
  </nav>

  <div class="main-container">
    
    <!-- Subida de Logs -->
    <div class="raider-card" style="margin-bottom: 30px;">
      <h1>Análisis de Combate</h1>
      <p style="color: var(--text-muted);">Subir WoWCombatLog.txt (Cataclismo 4.3.4)</p>

      <div class="file-zone">
        <input type="file" id="logInput" style="color: #fff;">
      </div>

      <button class="btn-gold" onclick="analizarLog()">Analizar Log de Combate</button>
    </div>

    <!-- Módulo de Rankings Globales -->
    <div class="raider-card">
      <div class="main-view-tabs">
        <button class="view-tab-btn active" onclick="cambiarVista('jugadores')">🏆 Ranking Personajes</button>
        <button class="view-tab-btn" onclick="cambiarVista('guilds')">🛡️ Ranking Hermandades</button>
      </div>

      <h1 style="text-align: left; margin-bottom: 15px;">Tabla de Clasificación (Leaderboards)</h1>
      
      <!-- Caritas de las 10 Clases (Solo íconos cuadrados compactos estilo RaiderIO) -->
      <div class="class-bar" id="classBarContainer"></div>

      <div class="search-filter-section">
        <select id="bossSelect" class="search-input" onchange="filtrarTabla()" style="cursor: pointer; font-weight: bold; color: var(--accent-gold); width: auto;">
          <option value="Morchok">👹 Morchok</option>
          <option value="Zon'ozz">👁️ Señor de la Guerra Zon'ozz</option>
          <option value="Yorsahj">🧪 Yor'sahj el Velador</option>
          <option value="Hagara">⚡ Hagara la Vinculadora</option>
          <option value="Ultraxion">🐉 Ultraxion</option>
          <option value="Cuerno Negra">🚢 Maestro de guerra Cuerno Negra</option>
          <option value="Espinazo">🔥 Espinazo de Alamuerte</option>
          <option value="Locura">🌋 Locura de Alamuerte</option>
        </select>

        <select id="diffSelect" class="search-input" onchange="filtrarTabla()" style="cursor: pointer; font-weight: bold; width: auto;">
          <option value="10N">10 Normal (10N)</option>
          <option value="25N">25 Normal (25N)</option>
          <option value="10H">10 Heroico (10H)</option>
          <option value="25H">25 Heroico (25H)</option>
          <option value="LFR">Buscador de Bandas (LFR)</option>
        </select>
        <input type="text" id="searchInput" class="search-input" placeholder="🔍 Buscar personaje..." onkeyup="filtrarTabla()">
        
        <div class="spec-tabs" id="specTabsContainer">
          <button class="tab-btn active" onclick="cambiarRama('Todas')">Todas</button>
        </div>
      </div>

      <table class="ranking-table">
        <thead>
          <tr id="tableHeaderRow">
            <th>#</th>
            <th>Personaje</th>
            <th>Clase</th>
            <th>Especialización</th>
            <th>DPS / HPS</th>
          </tr>
        </thead>
        <tbody id="rankingBody">
        </tbody>
      </table>
    </div>

  </div>

    function renderBarraClases() {
      const container = document.getElementById('classBarContainer');
      container.innerHTML = '';

      Object.keys(LOGOS_CLASES).forEach(clase => {
        const activeClass = (clase === claseSeleccionada) ? 'active' : '';
        container.innerHTML += `
          <button class="class-btn ${activeClass}" title="${clase}" onclick="seleccionarClase('${clase}')">
            <img src="${LOGOS_CLASES[clase]}" alt="${clase}">
          </button>
        `;
      });
    }

    function seleccionarClase(clase) {
      claseSeleccionada = clase;
      ramaSeleccionada = 'Todas';
      renderBarraClases();
      actualizarPestañasRamas();
      renderRanking();
    }

    function actualizarPestañasRamas() {
      const container = document.getElementById('specTabsContainer');
      container.innerHTML = '<button class="tab-btn active" onclick="cambiarRama(\'Todas\', event)">Todas</button>';

      if (ESPECILIZACIONES[claseSeleccionada]) {
        ESPECILIZACIONES[claseSeleccionada].forEach(rama => {
          const imgUrl = LOGOS_RAMAS[rama] || '';
          const imgTag = imgUrl ? `<img src="${imgUrl}" alt="${rama}">` : '';
          
          container.innerHTML += `
            <button class="tab-btn" onclick="cambiarRama('${rama}', event)">
              ${imgTag}
              ${rama}
            </button>
          `;
        });
      }
    }

    function cambiarRama(rama, e) {
      ramaSeleccionada = rama;
      document.querySelectorAll('.spec-tabs .tab-btn').forEach(btn => btn.classList.remove('active'));
      if (e && e.target) {
        const btn = e.target.closest('.tab-btn');
        if (btn) btn.classList.add('active');
      }
      renderRanking();
    }

    function cambiarVista(tipo) {
      vistaActual = tipo;
      document.querySelectorAll('.view-tab-btn').forEach(b => b.classList.remove('active'));
      if (event && event.target) event.target.classList.add('active');

      const containerJugadores = document.getElementById('classBarContainer');
      const filtersSection = document.querySelector('.search-filter-section');

      if (tipo === 'guilds') {
        if (containerJugadores) containerJugadores.style.display = 'none';
        if (filtersSection) filtersSection.style.display = 'none';
        renderGuilds();
      } else {
        if (containerJugadores) containerJugadores.style.display = 'flex';
        if (filtersSection) filtersSection.style.display = 'flex';
        renderRanking();
      }
    }

    function filtrarTabla() {

    function renderRanking() {
      const tbody = document.getElementById('rankingBody');
      const theadRow = document.getElementById('tableHeaderRow');
      const busqueda = document.getElementById('searchInput').value.toLowerCase();
      const bossFiltro = document.getElementById('bossSelect').value;
      const diffFiltro = document.getElementById('diffSelect').value;

      // Encabezados extendidos estilo Warcraft Logs
      theadRow.innerHTML = `
        <th>Rank</th>
        <th>Nombre</th>
        <th>iLvl</th>
        <th>DPS</th>
        <th>Fecha</th>
        <th>Duración</th>
        <th>Especialización</th>
        <th>Abalorios (Trinkets)</th>
        <th>Buffs</th>
      `;

      tbody.innerHTML = '';

      const filtrados = rankingData.filter(j => {
        const coincideClase = (j.clase === claseSeleccionada);
        const coincideRama = (ramaSeleccionada === 'Todas' || j.rama === ramaSeleccionada);
        const coincideNombre = j.nombre.toLowerCase().includes(busqueda);
        const coincideBoss = (!j.boss || j.boss === bossFiltro);
        const coincideDiff = (!j.diff || j.diff === diffFiltro);
        return coincideClase && coincideRama && coincideNombre && coincideBoss && coincideDiff;
      });

      if (filtrados.length === 0) {
        tbody.innerHTML = '<tr><td colspan="9" style="text-align:center; color:#8e94a8; padding: 25px;">No hay registros de combate con este filtro</td></tr>';
        return;
      }

      filtrados.forEach((j, index) => {
        const rank = index + 1;
        const logoClase = LOGOS_CLASES[j.clase] || '';
        
        // Iconos por defecto de abalorios BiS de Alma de Dragón (p. ej., Insignia / Frasco)
        const trinket1 = "https://render.worldofwarcraft.com/us/icons/56/inv_trinket_dragonsoul_01.jpg";
        const trinket2 = "https://render.worldofwarcraft.com/us/icons/56/inv_trinket_dragonsoul_02.jpg";

        tbody.innerHTML += `
          <tr>
            <td class="rank-top-1">#${rank}</td>
            <td style="font-weight:bold; color:#fff;">
              <img src="${logoClase}" class="class-icon-table" alt="">
              ${j.nombre}
            </td>
            <td class="item-level">${j.ilvl || '397'}</td>
            <td style="color:#f5ab00; font-weight:800; font-size: 0.95rem;">${j.dps}</td>
            <td style="color:#94a3b8;">${j.fecha || '17 Sep'}</td>
            <td style="color:#94a3b8;">${j.duracion || '3:45'}</td>
            <td style="color:#e2e8f0;">${j.rama}</td>
            <td>
              <img src="${trinket1}" class="trinket-icon" title="Abalorio 1">
              <img src="${trinket2}" class="trinket-icon" title="Abalorio 2">
            </td>
            <td><span class="buff-badge">${j.buffs || '4'}</span></td>
          </tr>
        `;
      });
    }

    function renderGuilds() {
      const tbody = document.getElementById('rankingBody');
      const theadRow = document.getElementById('tableHeaderRow');
      
      theadRow.innerHTML = `
        <th>#</th>
        <th>Hermandad (Guild)</th>
        <th>Progreso Banda</th>
        <th>DPS Conjunto</th>
        <th>Roster</th>

      tbody.innerHTML = '';
      guildsData.forEach(g => {
        tbody.innerHTML += `

            <td class="rank-top-1">#${g.rank}</td>
            <td style="font-weight:bold; color:#fff;">🛡️ ${g.nombre}</td>

            <td style="color:#f5ab00; font-weight:bold;">${g.dpsTotal}</td>
            <td>${g.miembros} Jugadores</td>
          </tr>
        `;
      });
    }

    async function analizarLog() {
      const fileInput = document.getElementById('logInput');
      if (!fileInput.files[0]) {
        alert("Por favor selecciona un archivo WoWCombatLog.txt primero");
        return;
      }

      const formData = new FormData();
      formData.append('combatlog', fileInput.files[0]);

      try {
        const respuesta = await fetch('/upload-log', {
          method: 'POST',
          body: formData
        });
        
        const datos = await respuesta.json();

        if (datos && datos.success && datos.ranking && datos.ranking.length > 0) {
          localStorage.setItem('resultadoWoW', JSON.stringify(datos.ranking));

          const bossSel = document.getElementById('bossSelect').value;
          const diffSel = document.getElementById('diffSelect').value;

          datos.ranking.forEach(p => {
            rankingData.unshift({
              nombre: p.nombre,
              clase: p.clase || 'Guerrero',
              rama: p.rama || 'Furia',
              boss: p.boss || bossSel,
              diff: p.dificultad || diffSel,
              dps: p.dps || (p.totalDaño / 60).toLocaleString('en-US', { maximumFractionDigits: 0 })
            });
          });

          renderRanking();
          alert("¡Log analizado correctamente y registrado en el Ranking!");
        } else {
          alert("El log se procesó pero no se encontraron eventos de combate válidos.");
        }

      } catch (error) {
        console.error("Error al analizar:", error);
        alert("Ocurrió un error al procesar el archivo en el servidor.");
      }
    }

    document.addEventListener('DOMContentLoaded', () => {
      renderBarraClases();
      actualizarPestañasRamas();
      renderRanking();
