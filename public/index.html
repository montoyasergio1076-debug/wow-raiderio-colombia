<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WoW Colombia 4.3.4 - RaiderIO & Logs</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-900 text-white min-h-screen flex flex-col items-center justify-center p-6">

    <div class="max-w-lg w-full bg-gray-800 rounded-lg p-8 shadow-xl border border-yellow-600">
        <h1 class="text-3xl font-bold text-yellow-500 text-center mb-2">WoW Colombia RaiderIO</h1>
        <p class="text-gray-400 text-center text-sm mb-6">Subir WoWCombatLog.txt (Cataclismo 4.3.4)</p>

        <form id="logForm" class="space-y-4">
            <input type="file" id="logFile" name="combatlog" accept=".txt" required
                class="w-full text-sm text-gray-300 file:mr-4 file:py-2 file:px-4 file:rounded-lg file:border-0 file:text-sm file:font-semibold file:bg-yellow-600 file:text-white hover:file:bg-yellow-700 cursor-pointer">
            
            <button type="submit" 
                class="w-full bg-yellow-500 hover:bg-yellow-600 text-black font-bold py-3 rounded-lg transition duration-200">
                Analizar Log de Combate
            </button>
        </form>

        <div id="resultado" class="mt-6 hidden">
            <h2 class="text-xl font-bold text-yellow-400 border-b border-gray-700 pb-2">Jefes Derrotados Detectados:</h2>
            <ul id="listaJefes" class="mt-3 space-y-2 text-sm text-gray-300"></ul>
        </div>
    </div>

    <script>
        const form = document.getElementById('logForm');
        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            const fileInput = document.getElementById('logFile');
            const formData = new FormData();
            formData.append('combatlog', fileInput.files[0]);

            const response = await fetch('/upload-log', {
                method: 'POST',
                body: formData
            });

            const data = await response.json();
            const resultadoDiv = document.getElementById('resultado');
            const listaJefes = document.getElementById('listaJefes');
            listaJefes.innerHTML = '';

            if (data.success && data.bossesDerrotados.length > 0) {
                resultadoDiv.classList.remove('hidden');
                data.bossesDerrotados.forEach(item => {
                    const li = document.createElement('li');
                    li.className = 'bg-gray-700 p-2 rounded flex justify-between';
                    li.innerHTML = `<span>⚔️ <b>${item.jefe}</b></span> <span class="text-gray-400">${item.hora}</span>`;
                    listaJefes.appendChild(li);
                });
            } else {
                resultadoDiv.classList.remove('hidden');
                listaJefes.innerHTML = '<li class="text-red-400">No se detectaron derrotas de jefes conocidas en este archivo.</li>';
            }
        });
    </script>

</body>
</html>
